name: Enel-med Slot Checker

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install chromium --with-deps

      - name: Run slot checker
        env:
          ENEL_LOGIN: ${{ secrets.ENEL_LOGIN }}
          ENEL_PASSWORD: ${{ secrets.ENEL_PASSWORD }}
          ENEL_CITY: ${{ secrets.ENEL_CITY }}
          ENEL_CATEGORY: ${{ secrets.ENEL_CATEGORY }}
          ENEL_SERVICE: ${{ secrets.ENEL_SERVICE }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: uv run app.py